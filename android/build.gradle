// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.google.gms:google-services:4.4.1')
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// The app's native clean reads autolinked libraries' generated JNI directories.
// Keep those directories until app clean finishes, including parallel builds.
subprojects { subproject ->
  if (subproject.path != ":app") {
    subproject.tasks.matching { it.name == "clean" }.configureEach {
      mustRunAfter(":app:clean")
    }
  }
}
